<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공부계획 · 최경수 포트폴리오</title>
<meta name="description" content="컴퓨터활용능력 1급 필기 학습 정리표">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#F2F4EC;
    --surface:#FFFFFF;
    --surface-2:#EAEEE0;
    --ink:#1B2118;
    --ink-soft:#4B5245;
    --ink-faint:#8A927D;
    --accent:#4C7A32;
    --accent-ink:#2E4A1E;
    --spark:#C97F1F;
    --line:#D7DCC9;
    --line-strong:#BFC7AC;
    --shadow: 0 1px 0 rgba(27,33,24,0.05);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12160F;
      --surface:#181D14;
      --surface-2:#1F251A;
      --ink:#ECEEE2;
      --ink-soft:#A8AF98;
      --ink-faint:#6C7460;
      --accent:#7FBF5A;
      --accent-ink:#B9E6A0;
      --spark:#E8A93C;
      --line:#2A3122;
      --line-strong:#38402C;
      --shadow: 0 1px 0 rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12160F;
    --surface:#181D14;
    --surface-2:#1F251A;
    --ink:#ECEEE2;
    --ink-soft:#A8AF98;
    --ink-faint:#6C7460;
    --accent:#7FBF5A;
    --accent-ink:#B9E6A0;
    --spark:#E8A93C;
    --line:#2A3122;
    --line-strong:#38402C;
    --shadow: 0 1px 0 rgba(0,0,0,0.35);
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Gothic A1", "Noto Sans KR", sans-serif;
    font-weight:400;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--accent); color:var(--bg); }

  .mono{
    font-family:"IBM Plex Mono","Consolas",monospace;
    letter-spacing:0.02em;
  }

  .wrap{
    max-width:1080px;
    margin:0 auto;
    padding:0 28px;
  }

  a{ color:inherit; }

  /* ---------- hero ---------- */
  header.hero{
    padding:64px 0 40px;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-family:"IBM Plex Mono",monospace;
    font-size:12.5px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--accent-ink);
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .eyebrow .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--spark);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--spark) 22%, transparent);
  }
  .back-link{
    font-family:"IBM Plex Mono",monospace;
    font-size:12.5px;
    color:var(--ink-faint);
    text-decoration:none;
    margin-left:auto;
  }
  .back-link:hover{ color:var(--accent-ink); }
  h1.title{
    font-family:"Black Han Sans", "Gothic A1", sans-serif;
    font-weight:400;
    font-size:clamp(32px, 6vw, 50px);
    line-height:1.08;
    margin:0 0 14px;
    letter-spacing:0.01em;
  }
  p.sub{
    font-size:15.5px;
    color:var(--ink-soft);
    max-width:64ch;
    margin:0;
  }
  p.note{
    font-size:13px;
    color:var(--ink-faint);
    max-width:64ch;
    margin:10px 0 0;
  }

  /* ---------- progress ---------- */
  .progress-row{
    display:flex;
    align-items:center;
    gap:16px;
    margin-top:28px;
    flex-wrap:wrap;
  }
  .progress-box{
    flex:1;
    min-width:220px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 18px;
  }
  .progress-label{
    display:flex;
    justify-content:space-between;
    font-size:12.5px;
    color:var(--ink-faint);
    margin-bottom:8px;
    font-family:"IBM Plex Mono",monospace;
  }
  .progress-label b{
    color:var(--accent-ink);
    font-weight:700;
  }
  .progress-track{
    height:6px;
    border-radius:4px;
    background:var(--surface-2);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    border-radius:4px;
    transition:width 0.3s ease;
  }
  .reset-btn{
    background:var(--surface);
    border:1px solid var(--line-strong);
    color:var(--ink-soft);
    border-radius:999px;
    padding:10px 18px;
    font-size:13px;
    font-family:inherit;
    cursor:pointer;
    white-space:nowrap;
  }
  .reset-btn:hover{
    border-color:var(--accent);
    color:var(--accent-ink);
  }

  /* ---------- chapters ---------- */
  main.wrap{
    padding:44px 28px 90px;
  }

  .chapter{
    margin-bottom:36px;
  }
  .chapter-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    margin-bottom:16px;
  }
  h2.chapter-title{
    font-family:"Black Han Sans","Gothic A1",sans-serif;
    font-weight:400;
    font-size:21px;
    margin:0;
    letter-spacing:0.01em;
  }
  .chapter-num{
    font-family:"IBM Plex Mono",monospace;
    font-size:12.5px;
    color:var(--ink-faint);
    white-space:nowrap;
  }
  .chapter-progress{
    font-family:"IBM Plex Mono",monospace;
    font-size:12px;
    color:var(--ink-faint);
    white-space:nowrap;
  }

  .table-scroll{
    border:1px solid var(--line);
    border-radius:16px;
    overflow-x:auto;
    background:var(--surface);
  }

  table{
    width:100%;
    border-collapse:collapse;
    min-width:760px;
  }

  thead th{
    text-align:left;
    font-family:"IBM Plex Mono",monospace;
    font-size:11.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-faint);
    font-weight:500;
    padding:14px 14px;
    border-bottom:1px solid var(--line);
    background:var(--surface-2);
    white-space:nowrap;
  }

  tbody td{
    padding:11px 14px;
    border-bottom:1px solid var(--line);
    font-size:14px;
    vertical-align:middle;
  }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr.done{
    background:color-mix(in srgb, var(--accent) 7%, transparent);
  }

  .col-check{ width:52px; text-align:center; }
  .col-content{ min-width:240px; }
  .col-date{ width:120px; }
  .col-mini{ width:56px; text-align:center; }
  .col-time{ width:90px; }

  .check{
    width:22px;
    height:22px;
    border-radius:6px;
    border:1.5px solid var(--line-strong);
    background:transparent;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    color:var(--accent-ink);
    font-size:13px;
    line-height:1;
    font-weight:700;
  }
  .check.on{
    border-color:var(--accent);
    background:color-mix(in srgb, var(--accent) 18%, transparent);
  }
  .check.mini{ width:20px; height:20px; font-size:12px; }

  .content-text{
    display:block;
  }
  .content-text.done{ color:var(--accent-ink); }

  input.field{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1px solid transparent;
    color:var(--ink);
    font-size:13.5px;
    font-family:inherit;
    padding:4px 2px;
    min-width:70px;
  }
  input.field::placeholder{ color:var(--ink-faint); }
  input.field:focus{
    outline:none;
    border-bottom:1px solid var(--accent);
  }

  footer.page-footer{
    margin-top:26px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:var(--ink-faint);
    font-size:12.5px;
    font-family:"IBM Plex Mono",monospace;
    flex-wrap:wrap;
    gap:12px;
  }

  @media (max-width:720px){
    header.hero{ padding:48px 0 32px; }
    main.wrap{ padding:32px 20px 70px; }
    .back-link{ margin-left:0; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="eyebrow">
      <span class="dot"></span>PORTFOLIO / 게임 콘텐츠 전공
      <a class="back-link" href="index.html">← 포트폴리오로 돌아가기</a>
    </div>
    <h1 class="title">공부계획</h1>
    <p class="sub">컴퓨터활용능력 1급 필기 1권 — Part 1. 컴퓨터 일반 학습 정리표. 이기적 컴퓨터활용능력 1급 필기 기본서(전4권) 기준입니다.</p>
    <p class="note">체크·날짜·시간 입력 내용은 이 브라우저에 자동 저장됩니다. 소단원 구성은 대략적인 정리이며 실제 교재와 순서가 다를 수 있습니다.</p>

    <div class="progress-row">
      <div class="progress-box">
        <div class="progress-label"><span>전체 진행률</span><b id="progressText">0 / 26</b></div>
        <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      </div>
      <button class="reset-btn" id="resetBtn">입력 내용 초기화</button>
    </div>
  </div>
</header>

<main class="wrap" id="chapters"></main>

<script>
  const CHAPTERS = [
    {
      title: "Chapter 1. 운영체제 사용",
      items: [
        "한글 Windows의 특징과 새 기능",
        "파일·폴더 생성 / 복사 / 이동 / 삭제 / 이름 바꾸기",
        "파일 탐색기 사용법과 보기 방식",
        "바로 가기 아이콘 만들기와 활용",
        "작업 표시줄과 시작 메뉴 사용자 지정",
        "클립보드 활용과 실행(Run) 명령"
      ]
    },
    {
      title: "Chapter 2. 컴퓨터 시스템 설정 변경",
      items: [
        "Windows 설정 — 개인 설정 · 디스플레이 · 테마",
        "앱 및 프로그램 설치 / 제거 관리",
        "장치 관리자와 하드웨어 설정",
        "네트워크 및 인터넷 연결 설정",
        "사용자 계정과 접근성 옵션",
        "날짜/시간 · 언어 및 국가별 형식 설정"
      ]
    },
    {
      title: "Chapter 3. 컴퓨터 시스템 관리",
      items: [
        "컴퓨터의 개념 · 분류 · 발전 과정",
        "자료 표현 방식 — 진법 변환, 문자 코드화",
        "중앙처리장치(CPU)와 기억장치의 구조",
        "입출력 장치와 포트 / 인터페이스 규격",
        "시스템 · 응용 소프트웨어의 개념과 종류",
        "프로그래밍 언어와 소프트웨어 저작권"
      ]
    },
    {
      title: "Chapter 4. 인터넷 자료 활용",
      items: [
        "정보통신망의 개념과 유형(LAN, WAN 등)",
        "인터넷 주소 체계 — IP 주소, 도메인 네임",
        "웹 브라우저와 전자우편 활용",
        "멀티미디어 개념과 그래픽 / 오디오 / 비디오 기법",
        "최신 IT 기술 동향 — 클라우드, IoT, 빅데이터 등"
      ]
    },
    {
      title: "Chapter 5. 컴퓨터 시스템 보호",
      items: [
        "정보사회의 문제점과 컴퓨터 범죄 유형",
        "바이러스와 악성코드 예방",
        "정보 보안 요소 — 방화벽, 암호화 등",
        "개인정보 보호와 저작권"
      ]
    }
  ];

  const TOTAL_ITEMS = CHAPTERS.reduce((acc, c) => acc + c.items.length, 0);
  const STORAGE_KEY = "study-plan-comfac1-v1";

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){
      return {};
    }
  }
  function saveState(state){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  let state = loadState();

  function getRow(key){
    if(!state[key]) state[key] = { done:false, date:"", practice:false, applied:false, time:"" };
    return state[key];
  }

  const chaptersEl = document.getElementById("chapters");
  const progressText = document.getElementById("progressText");
  const progressFill = document.getElementById("progressFill");

  function updateGlobalProgress(){
    let done = 0;
    CHAPTERS.forEach((c, ci) => {
      c.items.forEach((_, ii) => {
        if(getRow(`${ci}-${ii}`).done) done++;
      });
    });
    progressText.textContent = `${done} / ${TOTAL_ITEMS}`;
    progressFill.style.width = `${(done / TOTAL_ITEMS) * 100}%`;
  }

  function render(){
    chaptersEl.innerHTML = "";

    CHAPTERS.forEach((chapter, ci) => {
      const doneInChapter = chapter.items.reduce((acc, _, ii) => acc + (getRow(`${ci}-${ii}`).done ? 1 : 0), 0);

      const section = document.createElement("section");
      section.className = "chapter";

      let rows = "";
      chapter.items.forEach((content, ii) => {
        const key = `${ci}-${ii}`;
        const row = getRow(key);
        rows += `
          <tr class="${row.done ? 'done' : ''}">
            <td class="col-check"><button class="check" data-key="${key}" data-field="done" aria-label="완료 체크">${row.done ? '✓' : ''}</button></td>
            <td class="col-content"><span class="content-text ${row.done ? 'done' : ''}">${content}</span></td>
            <td class="col-date"><input class="field" data-key="${key}" data-field="date" placeholder="날짜" value="${row.date}"></td>
            <td class="col-mini"><button class="check mini" data-key="${key}" data-field="practice" aria-label="실습 체크">${row.practice ? '✓' : ''}</button></td>
            <td class="col-mini"><button class="check mini" data-key="${key}" data-field="applied" aria-label="응용 체크">${row.applied ? '✓' : ''}</button></td>
            <td class="col-time"><input class="field" data-key="${key}" data-field="time" placeholder="시간" value="${row.time}"></td>
          </tr>`;
      });

      section.innerHTML = `
        <div class="chapter-head">
          <h2 class="chapter-title">${chapter.title}</h2>
          <span class="chapter-progress mono">${doneInChapter} / ${chapter.items.length}</span>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th class="col-check">완료</th>
                <th class="col-content">주요 내용</th>
                <th class="col-date">날짜</th>
                <th class="col-mini">실습</th>
                <th class="col-mini">응용</th>
                <th class="col-time">시간</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
      chaptersEl.appendChild(section);
    });

    chaptersEl.querySelectorAll("button.check").forEach(btn => {
      btn.addEventListener("click", () => {
        const key = btn.dataset.key;
        const field = btn.dataset.field;
        const row = getRow(key);
        row[field] = !row[field];
        saveState(state);
        render();
        updateGlobalProgress();
      });
    });

    chaptersEl.querySelectorAll("input.field").forEach(input => {
      input.addEventListener("input", () => {
        const key = input.dataset.key;
        const field = input.dataset.field;
        const row = getRow(key);
        row[field] = input.value;
        saveState(state);
      });
    });

    updateGlobalProgress();
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if(confirm("입력한 체크 및 내용을 모두 초기화할까요?")){
      state = {};
      saveState(state);
      render();
    }
  });

  render();
</script>

<footer class="page-footer wrap">
  <span>총 5개 챕터 · 26개 항목</span>
  <span>최경수 · 유한대학교 컴퓨터공학과 게임콘텐츠전공</span>
</footer>

</body>
</html>
