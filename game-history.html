<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>게임플레이이력체크표 · 최경수 포트폴리오</title>
<meta name="description" content="최경수의 게임 플레이 이력 체크표">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#F2F4EC;
    --surface:#FFFFFF;
    --surface-2:#EAEEE0;
    --ink:#1B2118;
    --ink-soft:#4B5245;
    --ink-faint:#8A927D;
    --accent:#4C7A32;
    --accent-ink:#2E4A1E;
    --spark:#C97F1F;
    --line:#D7DCC9;
    --line-strong:#BFC7AC;
    --shadow: 0 1px 0 rgba(27,33,24,0.05);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12160F;
      --surface:#181D14;
      --surface-2:#1F251A;
      --ink:#ECEEE2;
      --ink-soft:#A8AF98;
      --ink-faint:#6C7460;
      --accent:#7FBF5A;
      --accent-ink:#B9E6A0;
      --spark:#E8A93C;
      --line:#2A3122;
      --line-strong:#38402C;
      --shadow: 0 1px 0 rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12160F;
    --surface:#181D14;
    --surface-2:#1F251A;
    --ink:#ECEEE2;
    --ink-soft:#A8AF98;
    --ink-faint:#6C7460;
    --accent:#7FBF5A;
    --accent-ink:#B9E6A0;
    --spark:#E8A93C;
    --line:#2A3122;
    --line-strong:#38402C;
    --shadow: 0 1px 0 rgba(0,0,0,0.35);
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Gothic A1", "Noto Sans KR", sans-serif;
    font-weight:400;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--accent); color:var(--bg); }

  .mono{
    font-family:"IBM Plex Mono","Consolas",monospace;
    letter-spacing:0.02em;
  }

  .wrap{
    max-width:1080px;
    margin:0 auto;
    padding:0 28px;
  }

  a{ color:inherit; }

  /* ---------- hero (같은 스타일) ---------- */
  header.hero{
    padding:64px 0 40px;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-family:"IBM Plex Mono",monospace;
    font-size:12.5px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--accent-ink);
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
  }
  .eyebrow .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--spark);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--spark) 22%, transparent);
  }
  .back-link{
    font-family:"IBM Plex Mono",monospace;
    font-size:12.5px;
    color:var(--ink-faint);
    text-decoration:none;
    margin-left:auto;
  }
  .back-link:hover{ color:var(--accent-ink); }
  h1.title{
    font-family:"Black Han Sans", "Gothic A1", sans-serif;
    font-weight:400;
    font-size:clamp(32px, 6vw, 50px);
    line-height:1.08;
    margin:0 0 14px;
    letter-spacing:0.01em;
  }
  p.sub{
    font-size:15.5px;
    color:var(--ink-soft);
    max-width:60ch;
    margin:0;
  }

  /* ---------- progress ---------- */
  .progress-row{
    display:flex;
    align-items:center;
    gap:16px;
    margin-top:28px;
    flex-wrap:wrap;
  }
  .progress-box{
    flex:1;
    min-width:220px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 18px;
  }
  .progress-label{
    display:flex;
    justify-content:space-between;
    font-size:12.5px;
    color:var(--ink-faint);
    margin-bottom:8px;
    font-family:"IBM Plex Mono",monospace;
  }
  .progress-label b{
    color:var(--accent-ink);
    font-weight:700;
  }
  .progress-track{
    height:6px;
    border-radius:4px;
    background:var(--surface-2);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    border-radius:4px;
    transition:width 0.3s ease;
  }
  .reset-btn{
    background:var(--surface);
    border:1px solid var(--line-strong);
    color:var(--ink-soft);
    border-radius:999px;
    padding:10px 18px;
    font-size:13px;
    font-family:inherit;
    cursor:pointer;
    white-space:nowrap;
  }
  .reset-btn:hover{
    border-color:var(--accent);
    color:var(--accent-ink);
  }

  /* ---------- table section ---------- */
  main.wrap{
    padding:44px 28px 90px;
  }

  .table-scroll{
    border:1px solid var(--line);
    border-radius:16px;
    overflow-x:auto;
    background:var(--surface);
  }

  table{
    width:100%;
    border-collapse:collapse;
    min-width:920px;
  }

  thead th{
    text-align:left;
    font-family:"IBM Plex Mono",monospace;
    font-size:11.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-faint);
    font-weight:500;
    padding:16px 16px;
    border-bottom:1px solid var(--line);
    background:var(--surface-2);
    white-space:nowrap;
  }

  tbody td{
    padding:13px 16px;
    border-bottom:1px solid var(--line);
    font-size:14px;
    vertical-align:middle;
  }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr.done{
    background:color-mix(in srgb, var(--accent) 7%, transparent);
  }

  .col-no{ width:44px; color:var(--ink-faint); font-family:"IBM Plex Mono",monospace; font-size:13px; }
  .col-date{ width:60px; color:var(--ink-faint); font-family:"IBM Plex Mono",monospace; font-size:13px; white-space:nowrap; }
  .col-app{ min-width:200px; font-weight:700; }
  .col-check{ width:56px; text-align:center; }
  .col-genre{ min-width:160px; color:var(--ink-soft); font-size:13.5px; }

  .check{
    width:24px;
    height:24px;
    border-radius:7px;
    border:1.5px solid var(--line-strong);
    background:transparent;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    color:var(--accent-ink);
    font-size:14px;
    line-height:1;
    font-weight:700;
  }
  .check.on{
    border-color:var(--accent);
    background:color-mix(in srgb, var(--accent) 18%, transparent);
  }

  input.field{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1px solid transparent;
    color:var(--ink);
    font-size:14px;
    font-family:inherit;
    padding:4px 2px;
    min-width:90px;
  }
  input.field::placeholder{ color:var(--ink-faint); }
  input.field:focus{
    outline:none;
    border-bottom:1px solid var(--accent);
  }

  .desc-input{ min-width:220px; }

  .app-name.done{ color:var(--accent-ink); }

  footer.page-footer{
    margin-top:26px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:var(--ink-faint);
    font-size:12.5px;
    font-family:"IBM Plex Mono",monospace;
    flex-wrap:wrap;
    gap:12px;
  }

  @media (max-width:720px){
    header.hero{ padding:48px 0 32px; }
    main.wrap{ padding:32px 20px 70px; }
    .eyebrow{ flex-wrap:wrap; }
    .back-link{ margin-left:0; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="eyebrow">
      <span class="dot"></span>PORTFOLIO / 게임 콘텐츠 전공
      <a class="back-link" href="index.html">← 포트폴리오로 돌아가기</a>
    </div>
    <h1 class="title">게임플레이이력체크표</h1>
    <p class="sub">9/10 — 9/23 기간 동안 플레이한 게임 목록입니다. 체크와 입력 내용은 이 브라우저에 자동 저장됩니다.</p>

    <div class="progress-row">
      <div class="progress-box">
        <div class="progress-label"><span>진행률</span><b id="progressText">0 / 14</b></div>
        <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      </div>
      <button class="reset-btn" id="resetBtn">입력 내용 초기화</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th class="col-no">순번</th>
          <th class="col-date">날짜</th>
          <th class="col-app">앱</th>
          <th class="col-check">완료</th>
          <th>기간</th>
          <th>레벨/티어</th>
          <th class="col-genre">장르</th>
          <th>게임 설명</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <footer class="page-footer">
    <span>총 14개 게임</span>
    <span>최경수 · 유한대학교 컴퓨터공학과 게임콘텐츠전공</span>
  </footer>
</main>

<script>
  const GAMES = [
    { date: "9/10", app: "제우스: 오만의 신", genre: "MMORPG" },
    { date: "9/11", app: "리니지M", genre: "MMORPG" },
    { date: "9/12", app: "SOL: enchant", genre: "MMORPG" },
    { date: "9/13", app: "WOS: 화이트아웃 서바이벌", genre: "전략 시뮬레이션(생존)" },
    { date: "9/14", app: "킹샷: Kingshot", genre: "전략 시뮬레이션" },
    { date: "9/15", app: "오딘: 발할라 라이징", genre: "MMORPG" },
    { date: "9/16", app: "메이플 키우기", genre: "방치형 RPG" },
    { date: "9/17", app: "이클립스: 더 어웨이크닝", genre: "MMORPG" },
    { date: "9/18", app: "로블록스 (Roblox)", genre: "샌드박스/메타버스" },
    { date: "9/19", app: "가십하버: 합성 & 스토리 게임", genre: "퍼즐/합성·스토리" },
    { date: "9/20", app: "로얄 매치 Royal Match", genre: "퍼즐(매치3)" },
    { date: "9/21", app: "운빨존많겜", genre: "캐주얼 전략 타워 디펜스" },
    { date: "9/22", app: "라스트 워: 서바이벌", genre: "전략 시뮬레이션" },
    { date: "9/23", app: "열혈강호: 넥스트", genre: "MMORPG" }
  ];

  const STORAGE_KEY = "game-play-checklist-v1";

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){
      return {};
    }
  }

  function saveState(state){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){ /* ignore */ }
  }

  let state = loadState();

  function getRow(i){
    if(!state[i]) state[i] = { done:false, period:"", level:"", desc:"" };
    return state[i];
  }

  const tbody = document.getElementById("tbody");
  const progressText = document.getElementById("progressText");
  const progressFill = document.getElementById("progressFill");

  function updateProgress(){
    const doneCount = GAMES.reduce((acc, _, i) => acc + (getRow(i).done ? 1 : 0), 0);
    progressText.textContent = `${doneCount} / ${GAMES.length}`;
    progressFill.style.width = `${(doneCount / GAMES.length) * 100}%`;
  }

  function render(){
    tbody.innerHTML = "";
    GAMES.forEach((g, i) => {
      const row = getRow(i);
      const tr = document.createElement("tr");
      tr.className = row.done ? "done" : "";

      tr.innerHTML = `
        <td class="col-no">${i + 1}</td>
        <td class="col-date">${g.date}</td>
        <td class="col-app"><span class="app-name ${row.done ? 'done' : ''}">${g.app}</span></td>
        <td class="col-check"><button class="check ${row.done ? 'on' : ''}" data-idx="${i}" aria-label="완료 체크">${row.done ? '✓' : ''}</button></td>
        <td><input class="field" data-idx="${i}" data-field="period" placeholder="예: 3일" value="${row.period}"></td>
        <td><input class="field" data-idx="${i}" data-field="level" placeholder="레벨/티어" value="${row.level}"></td>
        <td class="col-genre">${g.genre}</td>
        <td><input class="field desc-input" data-idx="${i}" data-field="desc" placeholder="게임 설명" value="${row.desc}"></td>
      `;
      tbody.appendChild(tr);
    });

    tbody.querySelectorAll(".check").forEach(btn => {
      btn.addEventListener("click", () => {
        const i = btn.dataset.idx;
        const row = getRow(i);
        row.done = !row.done;
        saveState(state);
        render();
        updateProgress();
      });
    });

    tbody.querySelectorAll("input.field").forEach(input => {
      input.addEventListener("input", () => {
        const i = input.dataset.idx;
        const field = input.dataset.field;
        const row = getRow(i);
        row[field] = input.value;
        saveState(state);
      });
    });

    updateProgress();
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if(confirm("입력한 체크 및 내용을 모두 초기화할까요?")){
      state = {};
      saveState(state);
      render();
    }
  });

  render();
</script>
</body>
</html>
